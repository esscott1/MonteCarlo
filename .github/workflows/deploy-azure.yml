name: Deploy to Azure

on:
  push:
    branches: [master]
    paths:
      - 'MonteCarloSimulation.Web/**'
      - 'MonteCarloSimulation.Core/**'
      - '.github/workflows/deploy-azure.yml'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore & test
        run: dotnet test MonteCarlo.sln --configuration Release

      - name: Publish
        run: dotnet publish MonteCarloSimulation.Web/MonteCarloSimulation.Web.csproj -c Release -o ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: montecarlo-otsconsulting
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
