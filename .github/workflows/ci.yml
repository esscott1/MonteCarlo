name: CI

# Runs the full test suite on every pull request, so each PR shows a pass/fail check before it's merged - including
# the PRs the agent workflows open. The deploy workflow runs the same tests again after merge.
on:
  pull_request:

permissions:
  contents: read

# A new push to the same PR cancels the run it supersedes
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test MonteCarlo.sln --configuration Release

      # The agent workflows' scripts: label routing and the checks that keep handlers off master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test the agent workflow scripts
        run: node --test ".github/scripts/*.test.mjs"
