name: CI

# Runs the full test suite on every pull request, so each PR shows a pass/fail check before it's merged. The deploy
# workflow runs the same tests again after merge.
#
# A pull request opened by a workflow with its built-in GITHUB_TOKEN - as the agent workflows do - doesn't start other
# workflows (GitHub's rule against runaway chains), so pull_request never fires for those. agent-finish therefore starts
# this workflow on the agent's branch with workflow_dispatch (the one event that rule allows); its check shows on the PR
# because it runs on the PR's head commit.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR (or a new run on the same branch) cancels the run it supersedes
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test MonteCarlo.sln --configuration Release

      # The agent workflows' scripts: label routing and the checks that keep handlers off master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test the agent workflow scripts
        run: node --test ".github/scripts/*.test.mjs"
