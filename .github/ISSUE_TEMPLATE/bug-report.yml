name: Bug report
description: Something on the site is wrong or broken.
labels: ["type: bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. Please don't include personal financial details; made-up numbers that show the problem are best.
  - type: dropdown
    id: page
    attributes:
      label: Which page?
      options:
        - Home
        - Scenario runner
        - Optimizer
        - Model Info
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The steps and inputs that show the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome on Windows, Safari on iPhone...
    validations:
      required: false
