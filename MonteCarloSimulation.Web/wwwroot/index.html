<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monte Carlo Retirement Calculator</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="page-header">
        <h1>Monte Carlo Retirement Calculator</h1>
        <button type="button" id="edit-toggle" class="icon-button" aria-label="Change request" aria-haspopup="dialog" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
        </button>

        <form id="edit-flyout" class="flyout" role="dialog" aria-labelledby="edit-flyout-title" hidden>
            <div class="flyout-header">
                <h2 id="edit-flyout-title" class="flyout-title">Ask AI for Change.</h2>
                <button type="button" id="edit-close" class="flyout-close" aria-label="Close">&times;</button>
            </div>
            <label>Summary
                <input type="text" name="summary" placeholder="Change the H1 and Title">
            </label>
            <label>Description
                <textarea name="description" rows="4" maxlength="35" placeholder="Enter new page title."></textarea>
            </label>
            <label>Passphrase
                <input type="password" name="passphrase" autocomplete="off">
            </label>
            <div class="flyout-actions">
                <button type="button" id="edit-cancel">Cancel</button>
                <button type="submit">Submit</button>
            </div>
            <div id="edit-result" aria-live="polite"></div>
        </form>
    </div>

    <form id="run-form">
        <fieldset>
            <legend>Investment Scenario</legend>
            <div id="scenario-options">Loading scenarios&hellip;</div>
        </fieldset>

        <div class="field-grid">
            <label>Years
                <input type="number" name="years" min="1" step="1" value="30" required>
            </label>
            <label>Iterations
                <input type="number" name="iterations" min="1" step="1" value="10" required>
            </label>
            <label>Annual Withdrawal
                <input type="text" inputmode="decimal" class="money-input" name="withdrawal" pattern="[0-9,]*\.?[0-9]*" value="96,000" required>
            </label>
            <label>Initial Taxable Balance
                <input type="text" inputmode="decimal" class="money-input" name="initialTaxableBalance" pattern="[0-9,]*\.?[0-9]*" value="400,000" required>
            </label>
            <label>Initial Nontaxable Balance
                <input type="text" inputmode="decimal" class="money-input" name="initialNontaxableBalance" pattern="[0-9,]*\.?[0-9]*" value="950,000" required>
            </label>
            <label>New Money (inheritance)
                <input type="text" inputmode="decimal" class="money-input" name="newMoney" pattern="[0-9,]*\.?[0-9]*" value="1,000,000" required>
            </label>
            <label>Year New Money Arrives
                <input type="number" name="yearNewMoney" min="0" step="1" value="10" required>
            </label>
            <label>Years Until Social Security
                <input type="number" name="socialSecurityYearsUntilStart" min="0" step="1" value="5" required>
            </label>
            <label>Initial Annual Social Security
                <input type="text" inputmode="decimal" class="money-input" name="socialSecurityAnnualAmount" pattern="[0-9,]*\.?[0-9]*" value="34,000" required>
            </label>
            <label>Annual Standard Deduction
                <input type="text" inputmode="decimal" class="money-input" name="annualStandardDeduction" pattern="[0-9,]*\.?[0-9]*" value="0" required>
            </label>
        </div>

        <button type="submit">Run</button>
    </form>

    <section id="results" aria-live="polite"></section>

    <script src="app.js"></script>
</body>
</html>
