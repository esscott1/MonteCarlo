<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monte Carlo Retirement Simulator</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <h1>Monte Carlo Retirement Simulator</h1>

    <form id="run-form">
        <fieldset>
            <legend>Investment Scenario</legend>
            <div id="scenario-options">Loading scenarios&hellip;</div>
        </fieldset>

        <div class="field-grid">
            <label>Years
                <input type="number" name="years" min="1" step="1" value="30" required>
            </label>
            <label>Iterations
                <input type="number" name="iterations" min="1" step="1" value="100" required>
            </label>
            <label>Annual Withdrawal
                <input type="number" name="withdrawal" min="0" step="any" value="120000" required>
            </label>
            <label>Initial Investment
                <input type="number" name="initialInvestment" min="0" step="any" value="2800000" required>
            </label>
            <label>New Money (inheritance)
                <input type="number" name="newMoney" min="0" step="any" value="0" required>
            </label>
            <label>Year New Money Arrives
                <input type="number" name="yearNewMoney" min="0" step="1" value="0" required>
            </label>
            <label>Years Until Social Security
                <input type="number" name="socialSecurityYearsUntilStart" min="0" step="1" value="10" required>
            </label>
            <label>Initial Annual Social Security
                <input type="number" name="socialSecurityAnnualAmount" min="0" step="any" value="0" required>
            </label>
        </div>

        <button type="submit">Run</button>
    </form>

    <section id="results" aria-live="polite"></section>

    <script src="app.js"></script>
</body>
</html>
