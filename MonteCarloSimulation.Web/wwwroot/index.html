<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mark retire NOW</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="page-header">
        <h1>Mark retire NOW</h1>
        <button type="button" id="edit-toggle" class="icon-button" aria-label="Change request" aria-haspopup="dialog" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
        </button>

        <form id="edit-flyout" class="flyout" role="dialog" aria-labelledby="edit-flyout-title" hidden>
            <div class="flyout-header">
                <h2 id="edit-flyout-title" class="flyout-title">Ask AI for Change.</h2>
                <button type="button" id="edit-close" class="flyout-close" aria-label="Close">&times;</button>
            </div>
            <label>Summary
                <input type="text" name="summary" placeholder="Change the H1 and Title">
            </label>
            <label>Description
                <textarea name="description" rows="4" maxlength="35" placeholder="Enter new page title."></textarea>
            </label>
            <label>Passphrase
                <input type="password" name="passphrase" autocomplete="off">
            </label>
            <div class="flyout-actions">
                <button type="button" id="edit-cancel">Cancel</button>
                <button type="submit">Submit</button>
            </div>
            <div id="edit-result" aria-live="polite"></div>
        </form>

        <button type="button" id="hamburger-toggle" class="icon-button hamburger-toggle" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 6h18" />
                <path d="M3 12h18" />
                <path d="M3 18h18" />
            </svg>
        </button>

        <div id="hamburger-menu" class="dropdown-menu" role="menu" hidden>
            <button type="button" id="observe-menu-item" role="menuitem">Observe</button>
        </div>

        <form id="observe-flyout" class="flyout flyout-right" role="dialog" aria-labelledby="observe-flyout-title" hidden>
            <div class="flyout-header">
                <h2 id="observe-flyout-title" class="flyout-title">Enter Passphrase</h2>
                <button type="button" id="observe-close" class="flyout-close" aria-label="Close">&times;</button>
            </div>
            <label>Passphrase
                <input type="password" name="passphrase" autocomplete="off">
            </label>
            <div class="flyout-actions">
                <button type="button" id="observe-cancel">Cancel</button>
                <button type="submit">Submit</button>
            </div>
            <div id="observe-result" aria-live="polite"></div>
        </form>
    </div>

    <form id="run-form">
        <fieldset>
            <legend>Investment Scenario</legend>
            <div id="scenario-options">Loading scenarios&hellip;</div>
        </fieldset>

        <details id="inputs-section" class="inputs-section" open>
        <summary>Your inputs</summary>
        <div class="field-grid">
            <div class="subgroup-row">
                <fieldset class="subgroup">
                    <legend>Scenario</legend>
                    <label>Years money lasts
                        <input type="number" name="years" min="1" max="999" step="1" value="30" style="width: calc(3ch + 1.6rem)" required>
                    </label>
                    <label>Iterations / Runs (99 max)
                        <input type="number" name="iterations" min="1" max="99" step="1" value="10" style="width: calc(3ch + 2rem)" required>
                    </label>
                    <label>Annual Withdrawal
                        <input type="text" inputmode="decimal" class="money-input" name="withdrawal" pattern="[0-9,]*\.?[0-9]*" value="96,000" style="width: calc(9ch + 1rem)" required>
                    </label>
                    <label>Birthdate
                        <input type="date" name="birthdate" value="1970-01-01" required>
                    </label>
                </fieldset>
                <fieldset class="subgroup">
                    <legend>Gov't</legend>
                    <label>Initial SS (annual)
                        <input type="text" inputmode="decimal" class="money-input" name="socialSecurityAnnualAmount" pattern="[0-9,]*\.?[0-9]*" value="30,000" style="width: calc(16ch + 1rem)" required>
                    </label>
                    <label>Years Until Social Security
                        <input type="number" name="socialSecurityYearsUntilStart" min="0" step="1" value="5" style="width: calc(16ch + 1.6rem)" required>
                    </label>
                    <label>Standard Ded. (Annual)
                        <input type="text" inputmode="decimal" class="money-input" name="annualStandardDeduction" pattern="[0-9,]*\.?[0-9]*" value="10,000" style="width: calc(16ch + 1rem)" required>
                    </label>
                </fieldset>
                <fieldset class="subgroup">
                    <legend>Tax Deferred Accts</legend>
                    <label>Balance
                        <input type="text" inputmode="decimal" class="money-input" name="initialTaxableBalance" pattern="[0-9,]*\.?[0-9]*" value="950,000" style="width: calc(16ch + 1rem)" required>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="enableRothConversions" checked>
                        Roth conversions
                    </label>
                </fieldset>
            </div>

            <div class="subgroup-row">
                <fieldset class="subgroup">
                    <legend>Roth Accts</legend>
                    <label>Basis
                        <input type="text" inputmode="decimal" class="money-input" name="initialRothBasis" pattern="[0-9,]*\.?[0-9]*" value="15,000" style="width: calc(16ch + 1rem)" required>
                    </label>
                    <label>Unrealized Gains
                        <input type="text" inputmode="decimal" class="money-input" name="initialRothUnrealizedGain" pattern="[0-9,]*\.?[0-9]*" value="5,000" style="width: calc(16ch + 1rem)" required>
                    </label>
                    <p class="total-line" id="roth-total">Total Roth = $20,000</p>
                </fieldset>
                <fieldset class="subgroup">
                    <legend>Brokerage Accts</legend>
                    <label>Basis
                        <input type="text" inputmode="decimal" class="money-input" name="initialBrokerageBasis" pattern="[0-9,]*\.?[0-9]*" value="200,000" style="width: calc(16ch + 1rem)" required>
                    </label>
                    <label>Unrealized Gains
                        <input type="text" inputmode="decimal" class="money-input" name="initialBrokerageUnrealizedGain" pattern="[0-9,]*\.?[0-9]*" value="200,000" style="width: calc(16ch + 1rem)" required>
                    </label>
                    <p class="total-line" id="brokerage-total">Total Brokerage = $400,000</p>
                </fieldset>
                <fieldset class="subgroup">
                    <legend>Inheritance</legend>
                    <label>New Money
                        <input type="text" inputmode="decimal" class="money-input" name="newMoney" pattern="[0-9,]*\.?[0-9]*" value="1,000,000" style="width: calc(16ch + 1rem)" required>
                    </label>
                    <label>When (years from now)
                        <input type="number" name="yearNewMoney" min="0" step="1" value="10" style="width: calc(16ch + 1.6rem)" required>
                    </label>
                </fieldset>
            </div>
        </div>

        <p class="total-line" id="grand-total">Total money = $1,370,000</p>
        </details>

        <button type="submit">Run</button>
    </form>

    <section id="results" aria-live="polite"></section>

    <script src="app.js"></script>
</body>
</html>
