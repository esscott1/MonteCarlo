<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="info.pageTitle">Model Info</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js"></script>
    <script src="visit.js" defer></script>
    <!-- A visitor who chose Spanish sees nothing until i18n.js has applied it, so English never flashes -->
    <style>html.i18n-pending body { visibility: hidden; }</style>
    <script>try { if (localStorage.getItem('lang') === 'es') document.documentElement.classList.add('i18n-pending'); } catch { }</script>
</head>
<body>
    <div class="page-header">
        <a href="/" class="icon-button" aria-label="Back to home" data-i18n-aria-label="nav.backHome">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5" />
                <path d="M12 19l-7-7 7-7" />
            </svg>
        </a>
        <h1 data-i18n="info.heading">Model Info</h1>

        <button type="button" class="lang-toggle" lang="es" aria-label="Ver en español">Español</button>
        <button type="button" class="theme-toggle" aria-label="Switch to dark mode">☾ Dark</button>
    </div>

    <p class="page-intro" data-i18n="info.intro">How the simulator's choices about which accounts to draw from, and how much to convert to Roth, were tested. The numbers come from the Strategy Lab: many simulated households, each run under every strategy on the same markets.</p>

    <main id="model-info" aria-live="polite">
        <p class="loading" data-i18n="info.loading">Loading the Strategy Lab results&hellip;</p>
    </main>

    <script src="i18n.js"></script>
    <script src="model-info.js"></script>
</body>
</html>
